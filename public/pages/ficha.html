<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice or Die - Ficha de Personagem</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
</head>
<body>
    <div class="body-shadow"></div>
    <div class="main-container">
        <!-- Left Column (Sidebar) -->
        <div class="left-column" id="sidebar">
            <!-- Logo será carregado aqui -->
            <div id="logo-slot"></div>
            
            <!-- Painéis do menu serão carregados dinamicamente -->
            <div id="menu-panels"></div>
        </div>
        
        <!-- Middle Column -->
        <div class="middle-column">
            <!-- Top Navigation -->
            <div class="top-nav" id="navbar">
                <!-- Links serão carregados dinamicamente -->
            </div>
            
            <!-- Ficha Form Card -->
            <div class="form-card">
                <div class="form-header">
                    <h1 id="paginaTitulo">Ficha Genérica</h1>
                </div>
                
                <form id="mainForm" class="ficha-form">
                    <!-- Dados Gerais Section -->
                    <div class="form-section">
                        <h2 class="section-title">Dados Gerais</h2>
                        
                        <div class="form-group">
                            <label for="nomeJogador">Nome do Jogador *</label>
                            <input type="text" id="nomeJogador" name="nomeJogador" placeholder="Nome do jogador" readonly class="readonly">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group flex-grow">
                                <label for="nomePersonagem">Nome do Personagem *</label>
                                <input type="text" id="nomePersonagem" name="nomePersonagem" placeholder="Digite o nome do personagem" required>
                            </div>
                            <div class="form-group flex-shrink">
                                <label for="nivel">Nível *</label>
                                <input type="number" id="nivel" name="nivel" min="1" max="20" value="1" required>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="raca">Raça *</label>
                                <select id="raca" name="raca" required>
                                    <option value="">Selecione uma raça</option>
                                    <option value="humano">Humano</option>
                                    <option value="elfo">Elfo</option>
                                    <option value="anao">Anão</option>
                                    <option value="halfling">Halfling</option>
                                    <option value="draconato">Draconato</option>
                                    <option value="gnomo">Gnomo</option>
                                    <option value="meio-elfo">Meio-Elfo</option>
                                    <option value="meio-orc">Meio-Orc</option>
                                    <option value="tiefling">Tiefling</option>
                                    <option value="aasimar">Aasimar</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="classe">Classe *</label>
                                <select id="classe" name="classe" required>
                                    <option value="">Selecione uma classe</option>
                                    <option value="barbaro">Bárbaro</option>
                                    <option value="bardo">Bardo</option>
                                    <option value="bruxo">Bruxo</option>
                                    <option value="clerigo">Clérigo</option>
                                    <option value="druida">Druida</option>
                                    <option value="feiticeiro">Feiticeiro</option>
                                    <option value="guerreiro">Guerreiro</option>
                                    <option value="ladino">Ladino</option>
                                    <option value="mago">Mago</option>
                                    <option value="monge">Monge</option>
                                    <option value="paladino">Paladino</option>
                                    <option value="patrulheiro">Patrulheiro</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="pontosVida">Pontos de Vida *</label>
                                <input type="number" id="pontosVida" name="pontosVida" min="1" placeholder="Ex: 25" required>
                            </div>
                            <div class="form-group">
                                <label for="classeArmadura">Classe de Armadura *</label>
                                <input type="number" id="classeArmadura" name="classeArmadura" min="1" placeholder="Ex: 15" required>
                            </div>
                        </div>
                    </div>

                    <!-- Atributos Section -->
                    <div class="form-section">
                        <h2 class="section-title">Atributos</h2>
                        <div class="attributes-grid">
                            <div class="attribute-group">
                                <label for="forca">Força *</label>
                                <input type="number" id="forca" name="forca" min="1" max="20" placeholder="10" required>
                            </div>
                            <div class="attribute-group">
                                <label for="destreza">Destreza *</label>
                                <input type="number" id="destreza" name="destreza" min="1" max="20" placeholder="10" required>
                            </div>
                            <div class="attribute-group">
                                <label for="constituicao">Constituição *</label>
                                <input type="number" id="constituicao" name="constituicao" min="1" max="20" placeholder="10" required>
                            </div>
                            <div class="attribute-group">
                                <label for="inteligencia">Inteligência *</label>
                                <input type="number" id="inteligencia" name="inteligencia" min="1" max="20" placeholder="10" required>
                            </div>
                            <div class="attribute-group">
                                <label for="sabedoria">Sabedoria *</label>
                                <input type="number" id="sabedoria" name="sabedoria" min="1" max="20" placeholder="10" required>
                            </div>
                            <div class="attribute-group">
                                <label for="carisma">Carisma *</label>
                                <input type="number" id="carisma" name="carisma" min="1" max="20" placeholder="10" required>
                            </div>
                        </div>
                    </div>

                    <!-- Foto do Personagem Section -->
                    <div class="form-section">
                        <h2 class="section-title">Foto do Personagem</h2>
                        <div class="avatar-container">
                            <div class="avatar-preview-container">
                                <img src="https://placehold.co/150x150/666/fff?text=Avatar" alt="Avatar do Personagem" id="characterPreview" class="avatar-preview">
                            </div>
                            <div class="avatar-actions">
                                <button type="button" class="upload-button" id="uploadButton">Escolher Foto</button>
                                <p class="upload-hint">Formato: JPG, PNG • Tamanho máximo: 2MB</p>
                            </div>
                        </div>
                    </div>                    <!-- Submit Button -->
                    <div class="form-actions">
                        <button type="submit" id="submitter" class="submit-button">Salvar Ficha</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Right Column -->
        <div class="right-column">
            <!-- User Profile será carregado aqui -->
            <div id="userbar-slot"></div>
            
            <!-- Painéis do lado direito serão carregados dinamicamente -->
            <div id="right-panels"></div>
        </div>
    </div>
    
    <!-- Scripts refatorados -->
    <script src="../assets/js/form-constants.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/page-mode-manager.js"></script>
    <script src="../assets/js/form-base.js"></script>
    <script src="../assets/js/ficha.js"></script>
    <script src="../assets/js/ficha-config.js"></script>
</body>
</html>
