<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{pageTitle}} - Dice or Die</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
</head>
<body>
    <div class="body-shadow"></div>
    <div class="main-container">
        <!-- Left Column (Sidebar) -->
        <div class="left-column" id="sidebar">
            <!-- Logo será carregado aqui -->
            <div id="logo-slot"></div>
            
            <!-- Painéis do menu serão carregados dinamicamente -->
            <div id="menu-panels"></div>
        </div>
        
        <!-- Middle Column -->
        <div class="middle-column">
            <!-- Top Navigation -->
            <div class="top-nav" id="navbar">
                <!-- Links serão carregados dinamicamente -->
            </div>
            
            <!-- Form Card -->
            <div class="form-card">
                <div class="form-header">
                    <h1 id="paginaTitulo">{{pageTitle}}</h1>
                </div>
                
                <!-- Content será inserido aqui -->
                <div id="form-content">
                    {{formContent}}
                </div>
            </div>
        </div>
        
        <!-- Right Column -->
        <div class="right-column">
            <!-- User Profile será carregado aqui -->
            <div id="userbar-slot"></div>
            
            <!-- Painéis do lado direito serão carregados dinamicamente -->
            <div id="right-panels"></div>
        </div>
    </div>
    
    <!-- Scripts básicos -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/page-mode-manager.js"></script>
    <script src="../assets/js/form-base.js"></script>
    
    <!-- Scripts específicos serão adicionados dinamicamente -->
    {{additionalScripts}}
</body>
</html>
